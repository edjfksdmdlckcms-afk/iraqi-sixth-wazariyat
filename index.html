<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>وزاريات السادس العلمي | تدريب</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f8;color:#272333;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:28px auto;padding:16px}.panel{background:#fff;border:1px solid #e8e1ef;border-radius:18px;padding:22px;box-shadow:0 8px 28px #34204b10}
h1{margin:0 0 8px;color:#704394;font-size:26px}p{color:#655d70;line-height:1.8}
.meta{font-size:13px;color:#6c6376;background:#f7f3fa;padding:10px 12px;border-radius:10px;margin:14px 0}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
select,textarea,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #d9d1e3}
select{min-width:180px;flex:1;background:white}textarea{width:100%;min-height:110px;resize:vertical;margin:12px 0}
button{cursor:pointer;font-weight:700}.primary{background:#74469a;color:white;border:0}.secondary{background:white;color:#59416d}
.qnum{color:#7b5796;font-weight:700}.question{font-size:19px;line-height:2;margin:20px 0}.answer{display:none;background:#f3eff8;border-right:4px solid #8154a4;border-radius:12px;padding:16px;margin-top:14px;line-height:2;white-space:pre-wrap}
.nav{display:flex;gap:10px;margin-top:16px}.nav button{flex:1}.small{font-size:12px;color:#82798a}
@media(max-width:600px){main{margin:8px auto}.panel{padding:16px}.question{font-size:17px}}
</style></head>
<body><main><section class="panel">
<h1>وزاريات السادس العلمي</h1>
<p>اختاري السؤال، اكتبي إجابتج، وبعدها اضغطي «كشف الإجابة» حتى تشوفين جواب الملزمة.</p>
<div class="top"><select id="subject"><option>اللغة العربية – القواعد</option></select><select id="chapter"><option>التصديق والتصور وخصائص (الهمزة – هل)</option></select></div>
<div class="meta">المصدر: وزاريات القواعد – الأستاذ حمزة الجابري، 2027، الجزء الأول. هذه نسخة تجربة أولية من الأسئلة التي تم التحقق من صفحاتها.</div>
<div class="qnum" id="number"></div>
<div class="question" id="question"></div>
<textarea id="student" placeholder="اكتبي إجابتج هنا..."></textarea>
<button class="primary" id="reveal">كشف الإجابة</button>
<div class="answer" id="answer"></div>
<div class="nav"><button class="secondary" id="prev">السابق</button><button class="secondary" id="next">التالي</button></div>
<p class="small" id="count"></p>
</section></main>
<script>
const questions=[
{q:"وضّحي الاستفهام الوارد في البيت، وبيّني نوعه والدليل عليه.",a:"الاستفهام بالهمزة المحذوفة.\nنوعه: تصوّري.\nالدليل: وجود (أم) المعادلة.",years:"الدور الثاني 1987"},
{q:"في قوله تعالى: «أَوَلَمْ تَكُنْ لَهُمْ آيَةٌ...»؛ لماذا لا يجوز أن يكون الاستفهام بغير الهمزة؟ وما نوع الاستفهام؟",a:"لا يجوز؛ لأن (هل) لا تدخل على الجملة المنفية.\nنوع الاستفهام: تصديقي.",years:"الدور الأول 1990، والدور الأول 2017"},
{q:"في البيت الشعري الوارد بالملزمة: أعربي حرف الاستفهام المحذوف من موضعه.",a:"حرف استفهام مبني على الفتح، لا محل له من الإعراب.",years:"الدور الأول 1990"},
{q:"في قوله تعالى: «أَفَلَمْ يَسِيرُوا فِي الْأَرْضِ...»؛ هل يمكن استبدال (هل) بالهمزة؟ علّلي.",a:"لا؛ لأن (هل) لا تدخل على الجملة المنفية.",years:"الدور الأول 1995، الدور الثاني 1990، الدور الثاني 2012"},
{q:"ما نوع الاستفهام الوارد في البيت الشعري الخامس؟ ولماذا؟",a:"نوع الاستفهام: تصوّري؛ لأن الإجابة عنه تكون بالتعيين.",years:"الدور الثاني 1990"},
{q:"في قول الشاعر: «عيدٌ بأية حالٍ عُدتَ يا عيدُ»؛ ما نوع الاستفهام في الشطر الثاني؟ وضّحيه وبيّني الدليل.",a:"استفهام تصوّري بالهمزة المحذوفة، والتقدير كما ورد في الملزمة.\nالدليل: وجود (أم) المعادلة.",years:"الدور الأول 1991"},
{q:"في قول الشاعر: «ومالي إلى العباس...»؛ ما خصوصية الهمزة؟ وهل يجوز استبدالها بـ(هل)؟",a:"حُذفت الهمزة من الكلام للتخفيف والتقدير.\nلا يجوز الاستبدال؛ لأن (هل) لا تدخل على الجملة المنفية.",years:"الدور الأول 1992"}
];
let index=0;
const $=id=>document.getElementById(id);
function render(){const x=questions[index];$("number").textContent="السؤال "+(index+1);$("question").textContent=x.q;$("answer").style.display="none";$("answer").textContent="الجواب: "+x.a+"\n\nالسنوات والأدوار: "+x.years;$("student").value="";$("count").textContent=(index+1)+" من "+questions.length+" أسئلة تجريبية";}
$("reveal").onclick=()=>{$("answer").style.display="block";};
$("prev").onclick=()=>{index=(index-1+questions.length)%questions.length;render();};
$("next").onclick=()=>{index=(index+1)%questions.length;render();};
render();
</script></body></html>
